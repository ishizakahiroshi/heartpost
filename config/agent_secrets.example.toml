# heartpost agent — secrets
#
# Copy to ~/heartpost/etc/agent_secrets.toml next to agent.toml, then:
#
#   chmod 600 ~/heartpost/etc/agent_secrets.toml
#
# The agent refuses to start if this file is readable by group or others. Shared
# hosting puts other accounts on the same machine, and anyone who can read this
# key can post reports under your agent's name — which also means they can keep
# a dead server looking alive.
#
# Keys in this file override the same keys in agent.toml. Keep it to secrets, so
# that agent.toml stays safe to copy around and to keep in version control.

[monitor]
# The shared key for this agent, as registered on the monitor. Reports are signed
# with HMAC-SHA256 using this value; the monitor rejects anything that does not verify.
api_key = "replace-me-with-the-key-from-your-monitor"
